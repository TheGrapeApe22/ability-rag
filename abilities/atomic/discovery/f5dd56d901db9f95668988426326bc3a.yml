      psh:
        command: get-aduser -f * -pr DoesNotRequirePreAuth | where {$_.DoesNotRequirePreAuth
          -eq $TRUE}
        payloads: []
        cleanup: ''
        parsers:
          plugins.atomic.app.parsers.atomic_powershell:
