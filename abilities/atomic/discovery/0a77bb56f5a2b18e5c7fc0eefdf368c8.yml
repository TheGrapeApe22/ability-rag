    file system information for all storage volumes on a system.
  tactic: discovery
  technique:
    attack_id: T1680
    name: Local Storage Discovery
  platforms:
    windows:
      cmd:
        command: wmic logicaldisk get deviceid, freespace, size, volumeserialnumber
        payloads: []
        cleanup: ''
