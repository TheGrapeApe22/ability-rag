---
- id: 66c05f40164fd0a40adf4593908b919e
  name: Execute Command via Transient systemd Service (systemd-run)
  description: 'Uses systemd-run to execute a command as a transient systemd service
    without creating

    a persistent unit file on disk. Adversaries may use systemd-run to execute arbitrary

    commands under the context of systemd while bypassing controls that monitor for
    new

    unit file creation, since transient services exist only in memory for their lifetime.


    This is a particularly stealthy technique as it leaves minimal on-disk artefacts
    and

    the service disappears from systemctl list-units once execution completes.

    '
  tactic: execution
  technique:
    attack_id: T1569.003
    name: 'System Services: Systemctl'
  platforms:
    linux:
      sh:
        command: systemd-run --unit=atomic-transient --wait /bin/bash -c "id > /tmp/atomic_transient_output.txt";
          systemctl status atomic-transient.service 2>/dev/null || echo "Transient
          service has already completed and exited."
        payloads: []
        cleanup: systemctl stop atomic-transient.service 2>/dev/null || true; rm -f
          /tmp/atomic_transient_output.txt
