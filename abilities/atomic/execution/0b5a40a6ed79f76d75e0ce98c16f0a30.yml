---
- id: 0b5a40a6ed79f76d75e0ce98c16f0a30
  name: Create systemd Service Unit from /tmp (Unusual Location)
  description: 'Creates a systemd service unit file in /tmp and loads it using systemctl
    start with

    an absolute path. Adversaries may write service unit files to world-writable directories

    such as /tmp to avoid triggering alerts on new file creation in standard service

    directories, or to execute payloads transiently without permanently installing
    a service.


    Loading a service unit from an arbitrary path rather than a standard systemd directory

    is unusual behaviour that should be detectable by monitoring systemctl command
    arguments.

    '
  tactic: execution
  technique:
    attack_id: T1569.003
    name: 'System Services: Systemctl'
  platforms:
    linux:
      sh:
        command: echo "[Unit]" > /tmp/atomic_tmp.service; echo "Description=Atomic
          Tmp Service" >> /tmp/atomic_tmp.service; echo "" >> /tmp/atomic_tmp.service;
          echo "[Service]" >> /tmp/atomic_tmp.service; echo "ExecStart=/bin/bash -c
          "id > /tmp/atomic_tmp_output.txt"" >> /tmp/atomic_tmp.service; echo "" >>
          /tmp/atomic_tmp.service; echo "[Install]" >> /tmp/atomic_tmp.service; echo
          "WantedBy=multi-user.target" >> /tmp/atomic_tmp.service; systemctl link
          /tmp/atomic_tmp.service; systemctl start $(basename /tmp/atomic_tmp.service);
          systemctl status $(basename /tmp/atomic_tmp.service)
        payloads: []
        cleanup: systemctl stop $(basename /tmp/atomic_tmp.service) 2>/dev/null ||
          true; rm -f /tmp/atomic_tmp.service; rm -f /tmp/atomic_tmp_output.txt
