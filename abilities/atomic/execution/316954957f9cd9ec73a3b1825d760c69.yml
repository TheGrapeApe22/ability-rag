---
- id: 316954957f9cd9ec73a3b1825d760c69
  name: Enable systemd Service for Persistence with Auto-Restart
  description: 'Creates a payload script and a systemd service unit that executes
    it, then enables

    the service to survive reboots using systemctl enable. The service is configured
    with

    Restart=always to automatically restart on failure, mimicking the persistence
    mechanism

    used by adversaries deploying backdoors or beacons on Linux hosts.


    This technique is consistent with observed post-exploitation tradecraft where
    adversaries

    establish a foothold that survives reboots and self-heals after interruption,
    complicating

    incident response and remediation efforts.

    '
  tactic: execution
  technique:
    attack_id: T1569.003
    name: 'System Services: Systemctl'
  platforms:
    linux:
      sh:
        command: 'if [ -f "#{payload_path}" ]; then : ; else echo ''#!/bin/bash''
          >; echo ''echo persistent >> /tmp/atomic_persist_output.txt'' >>; chmod
          +x;  echo "[Unit]" > /etc/systemd/system/#{service_name}.service; echo "Description=Atomic
          Persistence Service" >> /etc/systemd/system/#{service_name}.service; echo
          "After=network.target" >> /etc/systemd/system/#{service_name}.service; echo
          "" >> /etc/systemd/system/#{service_name}.service; echo "[Service]" >> /etc/systemd/system/#{service_name}.service;
          echo "ExecStart=#{payload_path}" >> /etc/systemd/system/#{service_name}.service;
          echo "Restart=always" >> /etc/systemd/system/#{service_name}.service; echo
          "RestartSec=10" >> /etc/systemd/system/#{service_name}.service; echo ""
          >> /etc/systemd/system/#{service_name}.service; echo "[Install]" >> /etc/systemd/system/#{service_name}.service;
          echo "WantedBy=multi-user.target" >> /etc/systemd/system/#{service_name}.service;
          systemctl daemon-reload; systemctl enable; systemctl start; systemctl status'
        payloads: []
        cleanup: systemctl stop; systemctl disable; rm -f /etc/systemd/system/#{service_name}.service;
          rm -f /etc/systemd/system/multi-user.target.wants/#{service_name}.service;
          systemctl daemon-reload; rm -f; rm -f /tmp/atomic_persist_output.txt
