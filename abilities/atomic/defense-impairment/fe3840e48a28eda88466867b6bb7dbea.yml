      sh:
        command: 'sed -i ''$ a #art_test_1562_006_1'' /etc/audisp/audispd.conf; if
          [ -f "/etc/auditd.conf" ]; then sed -i ''$ a #art_test_1562_006_1'' /etc/auditd.conf;
          else sed -i ''$ a #art_test_1562_006_1'' /etc/audit/auditd.conf; fi ; sed
