  tactic: defense-impairment
  technique:
    attack_id: T1686
    name: Disable or Modify System Firewall
  platforms:
    windows:
      cmd:
        command: netsh firewall set opmode mode=disable
        payloads: []
        cleanup: netsh firewall set opmode mode=enable >nul 2>&1
